# ---------------------------------------------------------------------------
# 测试环境配置（只覆盖必要项，其余沿用主 application.yml）
#
# 关键点：把数据源换成 H2 内存库，测试绝不碰 D:\erp-data 下的正式数据库。
# DB_CLOSE_DELAY=-1 让内存库在整个 JVM 生命周期内保持存在，
# 避免连接池归还连接后数据库被销毁、后一个测试用例查不到表。
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:erp_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# 测试固定走进程内缓存与内存会话，不依赖本机 Redis，CI 上也能跑
spring.cache.type=simple
erp.session.store=memory
management.health.redis.enabled=false

# 避免测试输出被 Spring Cloud / springdoc 的 INFO 日志淹没
logging.level.root=WARN
logging.level.com.erp=INFO

# AI 分析：测试环境强制走本地规则引擎，保证用例确定性（不依赖外网与密钥）
erp.ai.api-key=
erp.ai.enabled=true
