# 切换到 MySQL：先用客户端创建数据库
#   CREATE DATABASE erp DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
# 再按 README 中的命令以 --spring.profiles.active=mysql 启动，并通过环境变量传密码。
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ERP_DB_HOST:127.0.0.1}:${ERP_DB_PORT:3306}/${ERP_DB_NAME:erp}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${ERP_DB_USER:root}
    password: ${ERP_DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: false
