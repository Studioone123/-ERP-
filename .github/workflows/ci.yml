# ---------------------------------------------------------------------------
# 持续集成：每次 push / PR 自动跑测试与打包。
# 把 .mvn/maven.config 临时挪开，是因为它把仓库指向本机 D 盘 + 阿里云镜像；
# CI 环境用 Maven 默认配置（Central + setup-java 的缓存）更合适。
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Use default Maven settings in CI
        run: |
          if [ -f .mvn/maven.config ]; then mv .mvn/maven.config .mvn/maven.config.local; fi

      - name: Run unit and integration tests
        run: mvn -B test

      - name: Build executable jar
        run: mvn -B -DskipTests package

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: erp-system-jar
          path: target/erp-system.jar
